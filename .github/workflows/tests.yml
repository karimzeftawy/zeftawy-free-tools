name: Free tools tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test CleanCSV Lite
        working-directory: cleancsv-lite
        run: python -m unittest discover -s tests -v
      - name: Test TLS Expiry Lite
        working-directory: tls-expiry-lite
        run: python -m unittest discover -s tests -v
      - name: Test NetCheck Lite
        working-directory: netcheck-lite
        run: python -m unittest discover -s tests -v
  browser-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser CSV parser and formatter
        run: node --test tests/browser-csv.test.cjs
